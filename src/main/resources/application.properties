spring.application.name=travel-planner-api
server.port=${SERVER_PORT:8080}

# Configure credentials through the environment. Do not commit real values.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/travel_planner?serverTimezone=UTC&characterEncoding=UTF-8}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Production uses an explicit schema migration and validates it on startup.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# JWT_SECRET must be a Base64-encoded key with at least 256 bits of entropy.
app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=${JWT_ISSUER:travel-planner-api}
app.jwt.expiration=${JWT_EXPIRATION:86400000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.admin.email=${ADMIN_EMAIL:}
app.admin.name=${ADMIN_NAME:Travel Planner Admin}
app.admin.password=${ADMIN_PASSWORD:}

server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false
